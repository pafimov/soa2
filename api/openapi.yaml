openapi: 3.0.3
info:
  title: Marketplace
  version: 1.0.0
  description: 'ДЗ №2. Денежные значения передаются JSON-числами с точностью до копейки. Максимум суммы — DECIMAL(12,2).
    Для каждого запроса возвращается X-Request-Id. Неизвестные пути: ROUTE_NOT_FOUND (404), методы: METHOD_NOT_ALLOWED
    (405), формат ошибки общий. Тело не больше 1 MiB. Ошибки валидации возвращают details.fields. Неизвестные поля
    JSON запрещены.'
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /products:
    post:
      operationId: createProduct
      summary: Создать товар. SELLER создаёт свои товары, ADMIN — любые.
      description: 'Создать товар. SELLER создаёт свои товары, ADMIN — любые.

        Роли: SELLER, ADMIN.'
      responses:
        '201':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
    get:
      operationId: listProducts
      summary: 'Список всех товаров, включая ARCHIVED. Фильтры соединяются через AND. Порядок: created_at DESC,
        id DESC.'
      description: 'Список всех товаров, включая ARCHIVED. Фильтры соединяются через AND. Порядок: created_at DESC,
        id DESC.

        Роли: USER, SELLER, ADMIN.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - USER
      - SELLER
      - ADMIN
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
          maximum: 10000000
      - name: size
        in: query
        schema:
          type: integer
          format: int64
          default: 20
          minimum: 1
          maximum: 100
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: category
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Точное совпадение, с учётом регистра.
  /products/{id}:
    get:
      operationId: getProduct
      summary: Получить любой товар.
      description: 'Получить любой товар.

        Роли: USER, SELLER, ADMIN.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - USER
      - SELLER
      - ADMIN
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    put:
      operationId: updateProduct
      summary: Заменить товар. SELLER — только свой, ADMIN — любой.
      description: 'Заменить товар. SELLER — только свой, ADMIN — любой.

        Роли: SELLER, ADMIN.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
    delete:
      operationId: deleteProduct
      summary: 'Мягкое удаление: ARCHIVED. SELLER — только свой, ADMIN — любой. Повторное удаление возвращает 204.'
      description: 'Мягкое удаление: ARCHIVED. SELLER — только свой, ADMIN — любой. Повторное удаление возвращает
        204.

        Роли: SELLER, ADMIN.'
      responses:
        '204':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - SELLER
      - ADMIN
  /orders:
    post:
      operationId: createOrder
      summary: 'Создать свой заказ. Проверки: лимит CREATE_ORDER, активный заказ, каталог, остатки, промокод. Резерв
        и запись атомарны.'
      description: 'Создать свой заказ. Проверки: лимит CREATE_ORDER, активный заказ, каталог, остатки, промокод.
        Резерв и запись атомарны.

        Роли: USER, ADMIN.'
      responses:
        '201':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - USER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      x-unique-product-ids: true
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Получить заказ. USER — только свой, ADMIN — любой.
      description: 'Получить заказ. USER — только свой, ADMIN — любой.

        Роли: USER, ADMIN.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '404':
          $ref: '#/components/responses/404'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - USER
      - ADMIN
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    put:
      operationId: updateOrder
      summary: Обновить позиции. USER — свой заказ, ADMIN — любой. Только CREATED. Лимит UPDATE_ORDER учитывается
        по пользователю, выполняющему запрос.
      description: 'Обновить позиции. USER — свой заказ, ADMIN — любой. Только CREATED. Лимит UPDATE_ORDER учитывается
        по пользователю, выполняющему запрос.

        Промокод проверяется заново; собственное использование не занимает дополнительное место. При сумме ниже
        минимума промокод снимается. Истёкший/неактивный код даёт 422 и откат всего обновления.

        Роли: USER, ADMIN.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - USER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      x-unique-product-ids: true
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Отменить заказ из CREATED или PAYMENT_PENDING. USER — свой, ADMIN — любой. Возвращаются остатки и
        одно использование промокода. Повторная отмена — 409.
      description: 'Отменить заказ из CREATED или PAYMENT_PENDING. USER — свой, ADMIN — любой. Возвращаются остатки
        и одно использование промокода. Повторная отмена — 409.

        Роли: USER, ADMIN.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - USER
      - ADMIN
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  /orders/{id}/status:
    post:
      operationId: changeOrderStatus
      summary: 'Дополнительный метод для ADMIN: CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED. Только один
        шаг. Для отмены есть /cancel.'
      description: 'Дополнительный метод для ADMIN: CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED. Только
        один шаг. Для отмены есть /cancel.

        Роли: ADMIN.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  /promo-codes:
    post:
      operationId: createPromoCode
      summary: Создать общий промокод.
      description: 'Создать общий промокод.

        Роли: SELLER, ADMIN.'
      responses:
        '201':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '409':
          $ref: '#/components/responses/409'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      x-roles:
      - SELLER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
  /auth/register:
    post:
      operationId: register
      summary: Регистрация USER или SELLER. ADMIN создаётся только через переменные окружения.
      description: 'Регистрация USER или SELLER. ADMIN создаётся только через переменные окружения.

        Без access token.'
      responses:
        '201':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '409':
          $ref: '#/components/responses/409'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      operationId: login
      summary: 'Войти: access JWT на 15 минут и refresh JWT на 14 дней.'
      description: 'Войти: access JWT на 15 минут и refresh JWT на 14 дней.

        Без access token.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '401':
          $ref: '#/components/responses/401'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Обменять refresh JWT на новую пару. Старый refresh становится недействительным.
      description: 'Обменять refresh JWT на новую пару. Старый refresh становится недействительным.

        Без access token.'
      responses:
        '200':
          description: Успешно
          headers:
            X-Request-Id:
              description: UUID запроса, создаётся сервером.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '401':
          $ref: '#/components/responses/401'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access JWT. Claim role: USER, SELLER или ADMIN.'
  schemas:
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    Role:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    ProductCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: money.Amount
          x-go-type-import:
            path: marketplace/internal/money
            name: money
        stock:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: integer
          format: int64
          minimum: 1
          description: Необязателен. SELLER может указать только свой ID. ADMIN может указать ID другого SELLER
            или ADMIN.
          x-go-name: SellerID
    ProductUpdate:
      type: object
      additionalProperties: false
      required:
      - name
      - price
      - stock
      - category
      - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: money.Amount
          x-go-type-import:
            path: marketplace/internal/money
            name: money
        stock:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
      description: Полная замена изменяемых полей. seller_id не меняется. stock — свободный остаток, без уже зарезервированных
        единиц.
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          x-go-name: ID
          x-go-type-skip-optional-pointer: true
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: money.Amount
          x-go-type-import:
            path: marketplace/internal/money
            name: money
        stock:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          x-go-name: SellerID
          x-go-type-skip-optional-pointer: true
        created_at:
          type: string
          format: date-time
          x-go-name: CreatedAt
        updated_at:
          type: string
          format: date-time
          x-go-name: UpdatedAt
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - content
      - totalElements
      - page
      - size
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int64
          minimum: 0
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
    OrderItemInput:
      type: object
      additionalProperties: false
      required:
      - product_id
      - quantity
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
          x-go-name: ProductID
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 999
    OrderItemResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - product_id
      - quantity
      - price_at_order
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          x-go-name: ID
        product_id:
          type: integer
          format: int64
          minimum: 1
          x-go-name: ProductID
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 999
        price_at_order:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: money.Amount
          x-go-type-import:
            path: marketplace/internal/money
            name: money
          x-go-name: PriceAtOrder
    OrderCreate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
          minItems: 1
          maxItems: 50
          uniqueItems: true
        promo_code:
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
          nullable: true
          x-go-name: PromoCode
      description: product_id в items не повторяются. Стоимость до скидки не больше 9999999999.99.
    OrderUpdate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
